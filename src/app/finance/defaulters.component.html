<h2>Defaulters</h2>
<button mat-raised-button color="primary" (click)="openDialog()">Add Defaulter</button>

<table mat-table [dataSource]="defaulters" class="mat-elevation-z8" style="width: 100%; margin-top: 1rem;">
  <ng-container matColumnDef="residentName">
    <th mat-header-cell *matHeaderCellDef>Resident</th>
    <td mat-cell *matCellDef="let d">{{ d.residentName }}</td>
  </ng-container>
  <ng-container matColumnDef="amount">
    <th mat-header-cell *matHeaderCellDef>Amount</th>
    <td mat-cell *matCellDef="let d">{{ d.amount }}</td>
  </ng-container>
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let d">
      <button mat-icon-button color="accent" (click)="openDialog(d)">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button color="warn" (click)="delete(d.customId)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
