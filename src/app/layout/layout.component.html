<div class="layout-container">
  <!-- Header with custom color -->
  <app-header class="header colored-header"></app-header>

  <!-- Main layout: sidebar + content -->
  <div class="main-body">
    <app-sidebar class="sidebar colored-sidebar" [collapsed]="isSidebarCollapsed"></app-sidebar>
    <div class="main-content">
      <router-outlet></router-outlet>
    </div>
  </div>

  <!-- Footer with same color as header -->
  <app-footer class="footer colored-header"></app-footer>
</div>
