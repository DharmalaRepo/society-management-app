<h2>Grievances</h2>

<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
  <mat-form-field appearance="fill" style="width: 200px;">
    <mat-label>Filter by Status</mat-label>
    <mat-select [(ngModel)]="selectedStatus" (selectionChange)="applyFilter()">
      <mat-option value="">All</mat-option>
      <mat-option value="Open">Open</mat-option>
      <mat-option value="In Progress">In Progress</mat-option>
      <mat-option value="Resolved">Resolved</mat-option>
    </mat-select>
  </mat-form-field>

  <button mat-raised-button color="primary" (click)="openDialog()">Add Grievance</button>
</div>

<div class="mat-elevation-z8" style="overflow-x: auto;">
  <table mat-table [dataSource]="filteredGrievances" class="mat-table" style="width: 100%;">

    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef> Title </th>
      <td mat-cell *matCellDef="let g"> {{ g.title }} </td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef> Description </th>
      <td mat-cell *matCellDef="let g"> {{ g.description }} </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let g"> {{ g.status }} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let g">
        <button mat-icon-button color="accent" (click)="openDialog(g)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="delete(g.customId)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
