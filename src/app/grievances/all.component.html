<div class="p-4">
  <button mat-flat-button color="primary" (click)="openDialog()">Raise Grievance</button>

  <table mat-table [dataSource]="grievances" class="mat-elevation-z8 w-full mt-4">
    <ng-container matColumnDef="subject">
      <th mat-header-cell *matHeaderCellDef>Subject</th>
      <td mat-cell *matCellDef="let row">{{ row.subject }}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let row">{{ row.description }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button color="accent" (click)="openDialog(row)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="delete(row.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['subject', 'description', 'actions']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['subject', 'description', 'actions']"></tr>
  </table>
</div>
