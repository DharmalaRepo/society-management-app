<mat-card class="approval-card">
  <mat-card-title class="card-title">
    Visitor Approval Requests
    <span *ngIf="(approvalRequests?.length ?? 0) > 0" class="badge">
  {{ approvalRequests.length }}
</span>
  </mat-card-title>

  <mat-card-content>
    <table mat-table [dataSource]="approvalRequests" class="mat-elevation-z8 full-width-table">

      <!-- Flat Number Column -->
      <ng-container matColumnDef="flatNumber">
        <th mat-header-cell *matHeaderCellDef>Flat</th>
        <td mat-cell *matCellDef="let request">{{ request.flatNumber }}</td>
      </ng-container>

      <!-- Visitor Name Column -->
      <ng-container matColumnDef="visitorName">
        <th mat-header-cell *matHeaderCellDef>Visitor</th>
        <td mat-cell *matCellDef="let request">{{ request.visitorName }}</td>
      </ng-container>

      <!-- Purpose Column -->
      <ng-container matColumnDef="purpose">
        <th mat-header-cell *matHeaderCellDef>Purpose</th>
        <td mat-cell *matCellDef="let request">{{ request.purpose }}</td>
      </ng-container>

      <!-- Time Column -->
      <ng-container matColumnDef="approvalRequestedAt">
        <th mat-header-cell *matHeaderCellDef>Requested At</th>
        <td mat-cell *matCellDef="let request">{{ request.approvalRequestedAt | date:'short' }}</td>
      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let request">
          <button mat-icon-button color="primary" (click)="openApprovalDialog(request)">
            <mat-icon>check_circle</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="openApprovalDialog(request, false)">
            <mat-icon>cancel</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <div *ngIf="approvalRequests?.length === 0" class="empty-state">
      No pending approval requests.
    </div>
  </mat-card-content>
</mat-card>
