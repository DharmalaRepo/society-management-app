<h2>Blacklist Management</h2>

<form [formGroup]="form" (ngSubmit)="addToBlacklist()">
  <mat-form-field class="full-width" appearance="outline">
    <mat-label>Mobile or Name</mat-label>
    <input matInput formControlName="mobileOrName" placeholder="Enter mobile number or name" />
  </mat-form-field>
  <button mat-flat-button color="warn" type="submit" [disabled]="form.invalid">Add to Blacklist</button>
</form>

<table mat-table [dataSource]="blacklistedItems" class="mat-elevation-z8 full-width-table">
  <ng-container matColumnDef="value">
    <th mat-header-cell *matHeaderCellDef>Mobile / Name</th>
    <td mat-cell *matCellDef="let item">{{ item }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let item">
      <button mat-icon-button color="primary" (click)="removeFromBlacklist(item)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
