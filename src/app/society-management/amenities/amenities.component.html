<mat-card class="amenities-card">
  <mat-card-title>Manage Amenities</mat-card-title>

  <mat-card-content>
    <div class="table-container">

      <div class="add-button-container">
        <button mat-flat-button color="primary" (click)="openDialog()">
          <mat-icon class="icon-left">add</mat-icon> Add New Amenity
        </button>
      </div>

      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 full-width-table">

        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef class="header-cell">Name</th>
          <td mat-cell *matCellDef="let element">{{ element.name }}</td>
        </ng-container>

        <!-- Location Column -->
        <ng-container matColumnDef="location">
          <th mat-header-cell *matHeaderCellDef class="header-cell">Location</th>
          <td mat-cell *matCellDef="let element">{{ element.location }}</td>
        </ng-container>

        <!-- Description Column -->
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef class="header-cell">Description</th>
          <td mat-cell *matCellDef="let element">{{ element.description }}</td>
        </ng-container>

        <!-- Active Column -->
        <ng-container matColumnDef="isActive">
          <th mat-header-cell *matHeaderCellDef class="header-cell">Active?</th>
          <td mat-cell *matCellDef="let element">
            <mat-icon [color]="element.isActive ? 'primary' : 'warn'">
              {{ element.isActive ? 'check_circle' : 'highlight_off' }}
            </mat-icon>
          </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="header-cell">Actions</th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button color="accent" (click)="openDialog(element)">
              <mat-icon class="icon-hover">edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteAmenity(element.id)">
              <mat-icon class="icon-hover">delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <!-- Header and Row declarations -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      </table>
    </div>
  </mat-card-content>
</mat-card>
