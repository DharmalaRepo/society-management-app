
<mat-card>
  <mat-card-title>Society Master</mat-card-title>
  <mat-card-content>
    <button mat-raised-button color="primary" (click)="openDialog()">Add Society</button>
    <table mat-table [dataSource]="societies" class="mat-elevation-z8 mt-4">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let element">{{element.name}}</td>
      </ng-container>

      <ng-container matColumnDef="registrationNumber">
        <th mat-header-cell *matHeaderCellDef>Reg. No.</th>
        <td mat-cell *matCellDef="let element">{{element.registrationNumber}}</td>
      </ng-container>

      <ng-container matColumnDef="city">
        <th mat-header-cell *matHeaderCellDef>City</th>
        <td mat-cell *matCellDef="let element">{{element.city}}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button color="primary" (click)="openDialog(element)"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button color="warn" (click)="deleteSociety(element.id)"><mat-icon>delete</mat-icon></button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-content>
</mat-card>
