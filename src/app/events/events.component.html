<h2>Events</h2>

<mat-tab-group>
  <mat-tab label="Upcoming Events">
    <div style="margin-top: 1rem;">
      <button mat-raised-button color="primary" (click)="openDialog()">Add Event</button>
    </div>

    <div class="mat-elevation-z8" style="margin-top: 1rem; overflow-x: auto;">
      <table mat-table [dataSource]="upcomingEvents" class="mat-table" style="width: 100%;">
        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef> Title </th>
          <td mat-cell *matCellDef="let e"> {{ e.title }} </td>
        </ng-container>

        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef> Date </th>
          <td mat-cell *matCellDef="let e"> {{ e.date | date }} </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Actions </th>
          <td mat-cell *matCellDef="let e">
            <button mat-icon-button color="accent" (click)="openDialog(e)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="delete(e.id)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="eventColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: eventColumns;"></tr>
      </table>
    </div>
  </mat-tab>

  <mat-tab label="Past Events">
    <div class="mat-elevation-z8" style="margin-top: 1rem; overflow-x: auto;">
      <table mat-table [dataSource]="pastEvents" class="mat-table" style="width: 100%;">
        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef> Title </th>
          <td mat-cell *matCellDef="let e"> {{ e.title }} </td>
        </ng-container>

        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef> Date </th>
          <td mat-cell *matCellDef="let e"> {{ e.date | date }} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="eventColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: eventColumns;"></tr>
      </table>
    </div>
  </mat-tab>
</mat-tab-group>
