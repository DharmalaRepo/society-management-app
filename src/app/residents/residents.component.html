<mat-card>
  <mat-card-title>Manage Residents</mat-card-title>
  <mat-card-content>
    <button mat-flat-button color="primary" (click)="openDialog()" style="margin-bottom: 16px;">
      <mat-icon>person_add</mat-icon> Add New Resident
    </button>

    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 full-width-table">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let r">{{ r.name }}</td>
      </ng-container>

      <ng-container matColumnDef="blockNumber">
        <th mat-header-cell *matHeaderCellDef>Block</th>
        <td mat-cell *matCellDef="let r">{{ r.blockNumber }}</td>
      </ng-container>

      <ng-container matColumnDef="flatNumber">
        <th mat-header-cell *matHeaderCellDef>Flat</th>
        <td mat-cell *matCellDef="let r">{{ r.flatNumber }}</td>
      </ng-container>

      <ng-container matColumnDef="mobileNumber">
        <th mat-header-cell *matHeaderCellDef>Mobile</th>
        <td mat-cell *matCellDef="let r">{{ r.mobileNumber }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let r">{{ r.email }}</td>
      </ng-container>

      <ng-container matColumnDef="residentType">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let r">{{ r.residentType }}</td>
      </ng-container>

      <ng-container matColumnDef="residencyStatus">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let r">{{ r.residencyStatus }}</td>
      </ng-container>

      <!-- Merged and fixed actions column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let r">
          <!-- Edit button -->
          <button mat-icon-button color="accent" (click)="openDialog(r)">
            <mat-icon>edit</mat-icon>
          </button>

          <!-- Toggle active/inactive -->
          <button mat-icon-button [color]="r.residencyStatus === 'ACTIVE' ? 'warn' : 'primary'"
                  (click)="toggleResidentStatus(r)">
            <mat-icon>
              {{ r.residencyStatus === 'ACTIVE' ? 'person_off' : 'person' }}
            </mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-content>
</mat-card>
