<h2 mat-dialog-title>Send Broadcast</h2>

<mat-dialog-content [formGroup]="form">
  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Title</mat-label>
    <input matInput formControlName="title" />
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Message</mat-label>
    <textarea matInput formControlName="message" rows="4"></textarea>
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Audience</mat-label>
    <mat-select formControlName="audience">
      <mat-option value="ALL">All Residents</mat-option>
      <mat-option value="FLATS">Selected Flats</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field *ngIf="form.get('audience')?.value === 'FLATS'" appearance="fill" class="full-width">
    <mat-label>Select Flat Numbers</mat-label>
    <mat-select formControlName="flatNumbers" multiple>
      <mat-option *ngFor="let flat of configService.getFlats()" [value]="flat">
        {{ flat }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Delivery Methods</mat-label>
    <mat-select formControlName="deliveryMethods" multiple>
      <mat-option value="EMAIL">Email</mat-option>
      <mat-option value="SMS">SMS</mat-option>
      <mat-option value="WHATSAPP">WhatsApp</mat-option>
    </mat-select>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-flat-button color="primary" (click)="save()" [disabled]="form.invalid">Send</button>
  <button mat-button (click)="close()">Cancel</button>
</mat-dialog-actions>
