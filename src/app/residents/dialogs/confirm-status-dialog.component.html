<h2 mat-dialog-title>Confirm {{ data.action | titlecase }}</h2>
<mat-dialog-content>
  <p class="confirm-message">
    Are you sure you want to <strong>{{ data.action }}</strong>
    <span class="highlight">{{ data.name }}</span>?
  </p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button color="primary" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="warn" (click)="confirm()">Yes</button>
</mat-dialog-actions>
