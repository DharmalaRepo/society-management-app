<h2 mat-dialog-title>{{ data ? 'Edit Vehicle' : 'Add Vehicle' }}</h2>

<mat-dialog-content [formGroup]="form">
  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Vehicle Number</mat-label>
    <input matInput formControlName="vehicleNumber" />
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Vehicle Type</mat-label>
    <input matInput formControlName="vehicleType" />
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Brand</mat-label>
    <input matInput formControlName="brand" />
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Color</mat-label>
    <input matInput formControlName="color" />
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Parking Slot</mat-label>
    <mat-select formControlName="parkingSlot">
      <mat-option *ngFor="let slot of parkingSlots" [value]="slot">
        {{ slot }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Flat Number</mat-label>
    <mat-select formControlName="flatNumber">
      <mat-option *ngFor="let flat of flatNumbers" [value]="flat">
        {{ flat }}
      </mat-option>
    </mat-select>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-flat-button color="primary" (click)="save()" [disabled]="form.invalid">Save</button>
  <button mat-button (click)="close()">Cancel</button>
</mat-dialog-actions>
