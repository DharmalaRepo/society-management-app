<h2 mat-dialog-title>{{ data ? 'Edit Poll' : 'Add Poll' }}</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Question</mat-label>
      <input matInput formControlName="question" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Options (comma-separated)</mat-label>
      <input matInput formControlName="options" />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-button color="primary" type="submit" [disabled]="form.invalid">Save</button>
  </mat-dialog-actions>
</form>
