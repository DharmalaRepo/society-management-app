<mat-card>
  <mat-card-title>
    Resident Directory
  </mat-card-title>

  <mat-card-content>
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Search Residents</mat-label>
      <input matInput [(ngModel)]="filterText" (keyup)="applyFilter()" placeholder="Search by name, flat number..." />
    </mat-form-field>

    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 full-width-table">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let resident">{{ resident.name }}</td>
      </ng-container>

      <ng-container matColumnDef="blockNumber">
        <th mat-header-cell *matHeaderCellDef>Block</th>
        <td mat-cell *matCellDef="let resident">{{ resident.blockNumber }}</td>
      </ng-container>

      <ng-container matColumnDef="flatNumber">
        <th mat-header-cell *matHeaderCellDef>Flat</th>
        <td mat-cell *matCellDef="let resident">{{ resident.flatNumber }}</td>
      </ng-container>

      <ng-container matColumnDef="mobileNumber">
        <th mat-header-cell *matHeaderCellDef>Mobile</th>
        <td mat-cell *matCellDef="let resident">{{ resident.mobileNumber }}</td>
      </ng-container>

      <ng-container matColumnDef="residentType">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let resident">{{ resident.residentType }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-content>
</mat-card>
