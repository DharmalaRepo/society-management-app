<div class="header">
  <h2>Guest Visit Logs</h2>
  <button mat-flat-button color="primary" (click)="openDialog()">Add Guest</button>
</div>

<div *ngIf="guests.length === 0" class="text-center">No guest entries found.</div>

<ul>
  <li *ngFor="let guest of guests">
    <strong>{{ guest.name }}</strong> - {{ guest.visitDate }}
    <button mat-icon-button (click)="openDialog(guest)">
      <mat-icon>edit</mat-icon>
    </button>
    <button mat-icon-button color="warn" (click)="guest.id && deleteGuest(guest.id)">
      <mat-icon>delete</mat-icon>
    </button>
  </li>
</ul>
