<h2 mat-dialog-title>Reset Password</h2>

<form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="dialog-form">

  <!-- Radio buttons to choose Reset Type -->
  <mat-radio-group
    [(ngModel)]="resetType"
    [ngModelOptions]="{standalone: true}"
    name="resetType"
    class="reset-method">

    <mat-radio-button value="token">Use Token</mat-radio-button>
    <mat-radio-button value="old">Use Old Password</mat-radio-button>
  </mat-radio-group>

  <!-- Common fields: Username + SocietyId -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Username</mat-label>
    <input matInput formControlName="username" required>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Society ID</mat-label>
    <input matInput formControlName="societyId" required>
  </mat-form-field>

  <!-- Conditionally show Token field -->
  <ng-container *ngIf="resetType === 'token'">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Reset Token</mat-label>
      <input matInput formControlName="token" required>
    </mat-form-field>
  </ng-container>

  <!-- Conditionally show Old Password field -->
  <ng-container *ngIf="resetType === 'old'">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Old Password</mat-label>
      <input matInput type="password" formControlName="oldPassword" required>
    </mat-form-field>
  </ng-container>

  <!-- Common New Password field -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>New Password</mat-label>
    <input matInput type="password" formControlName="newPassword" required>
  </mat-form-field>

  <!-- Action Buttons -->
  <div class="dialog-actions">
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="submitting">
      Reset Password
    </button>
  </div>

</form>
