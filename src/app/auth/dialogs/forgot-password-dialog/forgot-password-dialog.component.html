<h2 mat-dialog-title>{{ isTokenStage ? 'Reset Your Password' : 'Forgot Password' }}</h2>

<form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="dialog-form">
  <ng-container *ngIf="!isTokenStage">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Username</mat-label>
      <input matInput formControlName="username" required>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Society ID</mat-label>
      <input matInput formControlName="societyId" required>
    </mat-form-field>

    <div class="dialog-actions">
      <button mat-button type="button" (click)="onCancel()">Cancel</button>
      <button mat-flat-button color="primary" type="submit" [disabled]="submitting">
        Generate Token
      </button>
    </div>
  </ng-container>

  <ng-container *ngIf="isTokenStage">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Token</mat-label>
      <input matInput formControlName="token" required>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>New Password</mat-label>
      <input matInput type="password" formControlName="newPassword" required>
    </mat-form-field>

    <div class="dialog-actions">
      <button mat-button type="button" (click)="onCancel()">Cancel</button>
      <button mat-flat-button color="primary" type="submit" [disabled]="submitting">
        Reset Password
      </button>
    </div>
  </ng-container>
</form>
